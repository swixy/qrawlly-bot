<!DOCTYPE html>
<html>
<head>
    <title>Test Web App</title>
</head>
<body>
    <h1>Тест Web App</h1>
    <p>Если вы видите эту страницу, Web App сервер работает!</p>
    <p><a href="http://localhost:3001">Открыть Web App</a></p>
    
    <script>
        // Тест API
        fetch('http://localhost:3001/api/slots')
            .then(response => response.json())
            .then(data => {
                console.log('API работает:', data);
                document.body.innerHTML += '<p style="color: green;">✅ API работает!</p>';
            })
            .catch(error => {
                console.error('Ошибка API:', error);
                document.body.innerHTML += '<p style="color: red;">❌ Ошибка API: ' + error.message + '</p>';
            });
    </script>
</body>
</html>
